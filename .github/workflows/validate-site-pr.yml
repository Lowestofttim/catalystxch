name: Validate site PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install validation dependencies
        run: |
          python -m pip install playwright==1.60.0 cryptography==50.0.1
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y osslsigncode

      - name: Validate release metadata and website
        run: |
          python scripts/check_windows_release_verification.py
          python scripts/check_release_metadata.py
          python scripts/check_sync_release_fallbacks.py
          python scripts/check_sync_workflow.py
          node scripts/check_release_js_behavior.js
          python scripts/check_release_dom_rendering.py
          npx --yes html-validate@11.4.0 index.html docs.html beta-guide.html
